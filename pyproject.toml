[project]
name = "nestornotes"
version = "0.1.0"
description = "Open-source command-line client for the NestorNotes knowledge base. Auditable thin wrapper around the hosted MCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<4.0"
keywords = ["nestornotes", "mcp", "fastmcp", "cli", "knowledge-base"]
authors = [{ name = "NestorNotes" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "fastmcp>=3.2.0",
    # Required by fastmcp's OAuth flow with DiskStore-backed token persistence,
    # so the browser flow runs once per server URL rather than every CLI
    # invocation. Both are listed in py-key-value-aio's "disk" extra.
    "diskcache>=5.0.0",
    "pathvalidate>=3.3.1",
]

[project.urls]
Homepage = "https://nestornotes.com"
Repository = "https://github.com/nestornotes/nestornotes-cli"
Issues = "https://github.com/nestornotes/nestornotes-cli/issues"

[project.scripts]
nestornotes = "nestornotes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nestornotes"]

[tool.hatch.build.targets.sdist]
include = [
    "src/nestornotes",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
